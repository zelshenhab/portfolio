<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Zeyad Elshenhab</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07080d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2338d6ff'/><stop offset='1' stop-color='%237b61ff'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='%2307080d'/><text x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='28' text-anchor='middle' fill='url(%23g)'>ZE</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .nf { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px; }
    .nf-code { font-family: 'Syne', system-ui, sans-serif; font-weight: 800; font-size: clamp(110px, 26vw, 220px); line-height: 0.9; letter-spacing: -0.05em; }
    .nf h1 { font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); margin: 18px 0 10px; }
    .nf p { color: var(--text2); max-width: 420px; margin: 0 auto 32px; }
    .nf pre { display: inline-block; text-align: left; font-family: var(--font-mono); font-size: 13px; color: var(--text2); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; margin-bottom: 32px; }
    .nf pre .k { color: #c792ea; } .nf pre .s { color: #c3e88d; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-lines"></div>
  </div>
  <main class="nf">
    <div>
      <div class="nf-code grad">404</div>
      <h1 data-ru="Такой страницы нет">This page doesn't exist</h1>
      <p data-ru="Возможно, ссылка устарела или в ней опечатка. Зато на главной есть много интересного.">The link may be outdated or mistyped — but there's plenty to see on the home page.</p>
      <pre><code><span class="k">throw</span> RouteNotFound(<span class="s">'<span id="path">/</span>'</span>);</code></pre>
      <div>
        <a href="/" class="btn btn-primary">
          <svg viewBox="0 0 24 24" class="ic"><path d="M19 12H5m0 0 6 6m-6-6 6-6"/></svg>
          <span data-ru="На главную">Back to home</span>
        </a>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('path').textContent = location.pathname;
    let lang = null;
    try { lang = localStorage.getItem('lang'); } catch {}
    if (lang === 'ru') {
      document.documentElement.lang = 'ru';
      document.title = 'Страница не найдена — Zeyad Elshenhab';
      document.querySelectorAll('[data-ru]').forEach(el => { el.textContent = el.dataset.ru; });
    }
  </script>
</body>
</html>
